[project]
name = "feline-cli"
version = "0.4.0"
description = "Extensible command-line language model client"
requires-python = ">=3.10"
dependencies = [
    "openai==3.31.0",
    "google-genai==2.31.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
feline = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
